# Runs every help-page example of dartR.base twice, in memory and
# file-backed (dartR_fbm=true makes the examples convert their data with
# gl.gen2fbm), with function-review/run_examples_fbm.R. The job fails when
# an example fails only file-backed (a regression of the FBM code);
# examples failing in both modes (e.g. a missing optional package) are
# listed in the log but do not fail it. The table of results is uploaded as
# an artifact.
# Not run on every push (most pushes do not touch the FBM code): it runs for
# pull requests into dev and is started by hand before a merge into beta,
# e.g. gh workflow run FBM-examples --ref dev
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

name: FBM-examples

jobs:
  fbm-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      # SIBER (suggested by dartR.base) needs rjags, and rjags 5 needs JAGS 5.
      # Where the system offers only an older JAGS (Ubuntu ships 4.3.2), rjags
      # cannot be built, so SIBER is skipped; R CMD check does not require
      # suggested packages. Once JAGS 5 is available, SIBER is installed again.
      - name: Skip SIBER while JAGS 5 is not available
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          v=$(apt-cache policy jags | awk '/Candidate:/ {print $2}' | sed 's/^[0-9]*://')
          echo "JAGS offered by apt: ${v:-none}"
          case "$v" in
            [5-9]*|[1-9][0-9]*) echo "JAGS 5 or newer: SIBER is installed" ;;
            *) echo "IGNORE_ON_LINUX=SIBER=?ignore" >> "$GITHUB_ENV"
               echo "No JAGS 5: SIBER is skipped" ;;
          esac

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          # SIBER is skipped while JAGS 5 is not available (step above);
          # examples that need it then fail in both modes, which does not
          # fail the job
          extra-packages: |
            local::.
            ${{ env.IGNORE_ON_LINUX }}

      - name: Run the examples in memory and file-backed
        run: Rscript function-review/run_examples_fbm.R . fbm-examples.csv 600

      - name: Upload the table of results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fbm-examples
          path: fbm-examples.csv
